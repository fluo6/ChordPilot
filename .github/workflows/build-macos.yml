name: Build macOS

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac processor architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        run: bash scripts/build-macos.sh --distribution --arch=${{ inputs.architecture }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChordPilot-macOS-${{ inputs.architecture }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
